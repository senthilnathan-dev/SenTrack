name: CI

# Runs on every push to main and on every pull request. It checks what a reviewer would otherwise check by hand:
# the legal pages are in step with their source, the unit tests pass, lint is clean and the app builds.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: No personal information in the repository
        run: bash tools/check-no-personal-info.sh

      - name: Legal pages and changelog are up to date
        run: |
          bash tools/make-legal-pages.sh
          git diff --exit-code -- docs/site CHANGELOG.md \
            || { echo "::error::docs/site or CHANGELOG.md are out of date. Run: bash tools/make-legal-pages.sh and commit the result."; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: android-actions/setup-android@v3
      - name: Install the Android platform the build targets
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --console=plain

      - name: Lint
        run: ./gradlew lintDebug --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Keep test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
